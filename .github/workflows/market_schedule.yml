name: Rotina do Mercado e Rebalanceamento Robô Libra

on:
  schedule:
    # 1. Abertura das janelas de ordens: Terças, Quintas e Sextas às 19h05 BRT (22h05 UTC)
    - cron: '5 22 * * 2,4,5'
    # 2. Abertura da B3: Segunda a Sexta às 10h02 BRT (13h02 UTC) para atualizar preços e liquidar ordens pendentes
    - cron: '2 13 * * 1-5'
  workflow_dispatch: # Permite disparo manual via botão no GitHub

jobs:
  market_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Atualização de Cotações e Rebalanceamento do Robô
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node update_prices.js
          node rebalance_libra.js
