name: Rotina do Mercado e Rebalanceamento Robô Libra

on:
  schedule:
    # Abertura das janelas de ordens: Terças, Quintas e Sextas às 19h05 BRT (22h05 UTC)
    # Nesta única execução:
    # 1. Coleta cotações de fechamento da B3
    # 2. Executa/liquida ordens pendentes anteriores
    # 3. Roda o modelo de rebalanceamento da equipe Libra e lança novas ordens a mercado
    - cron: '5 22 * * 2,4,5'
  workflow_dispatch: # Permite disparo manual via botão na aba Actions

jobs:
  market_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Cotações, Liquidação e Rebalanceamento
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node update_prices.js
