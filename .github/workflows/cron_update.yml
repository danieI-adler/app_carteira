name: Auto Sync B3 Asset Prices & Execute Orders

on:
  schedule:
    # Runs once a day, punctually at 19:00 BRT (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:
    # Allows manual trigger from the Actions tab

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Price Sync & Order Execution
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node update_prices.js
