name: Auto Sync B3 Asset Prices

on:
  schedule:
    # Runs every 6 hours (at minute 0 of hour 0, 6, 12, 18)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger from the Actions tab

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Price Scriptor
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node update_prices.js
